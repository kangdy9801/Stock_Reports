<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공시 읽기 노트</title>
  <meta name="description" content="DART 반기·분기보고서 PDF를 올리면 9단계 투자 체크리스트로 비교해 주는 개인용 분석 도구">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-row">
      <div>
        <h1 class="brand">공시 읽기 노트</h1>
        <p class="brand-sub">반기·분기·사업보고서 PDF를 올리면 9단계 체크리스트로 비교해 드립니다. 파일은 내 브라우저 안에서만 읽고, 어디에도 보내지 않습니다.</p>
      </div>
      <nav class="toolbar" aria-label="작업">
        <button type="button" class="btn" id="btn-records">저장한 기록</button>
        <button type="button" class="btn" id="btn-save" disabled>기록 저장</button>
        <button type="button" class="btn" id="btn-print" disabled>인쇄·PDF 저장</button>
        <button type="button" class="btn" id="btn-export" disabled>파일로 내보내기</button>
        <button type="button" class="btn ghost" id="btn-import">파일 불러오기</button>
        <input type="file" id="import-input" accept="application/json,.json" hidden>
      </nav>
    </div>
    <div class="wrap">
      <div class="tabs" role="tablist" aria-label="분석 종류">
        <button type="button" class="tab" role="tab" data-mode="half" aria-selected="true" aria-controls="main">반기보고서 비교</button>
        <button type="button" class="tab" role="tab" data-mode="quarter" aria-selected="false" aria-controls="main" tabindex="-1">분기보고서 분석</button>
        <button type="button" class="tab" role="tab" data-mode="annual" aria-selected="false" aria-controls="main" tabindex="-1">사업보고서 분석</button>
      </div>
    </div>
  </header>

  <main class="wrap" id="main" role="tabpanel">
    <section class="intake" id="intake" aria-labelledby="intake-title">
      <h2 id="intake-title" class="sr-only">보고서 올리기</h2>
      <div class="drop" id="drop" tabindex="0" role="button" aria-describedby="drop-help">
        <input type="file" id="file-input" accept="application/pdf,.pdf" multiple hidden>
        <p class="drop-main">보고서 PDF를 끌어다 놓거나 눌러서 고르세요</p>
        <p class="drop-help" id="drop-help"></p>
      </div>
      <ol class="slots" id="slots" aria-live="polite"></ol>
      <p class="notice" id="notice" role="status" hidden></p>
    </section>

    <section id="empty" class="empty">
      <h2>이렇게 쓰면 됩니다</h2>
      <ol class="howto" id="howto"></ol>
    </section>

    <div id="results" hidden></div>
  </main>

  <footer class="foot wrap">
    <p>공부와 기록을 위한 도구입니다. 투자 권유가 아니며, 자동 추출 숫자는 반드시 원문과 대조하세요. 기록은 이 브라우저의 저장소에만 남으니, 중요한 기록은 '파일로 내보내기'로 따로 보관하세요.</p>
  </footer>

  <dialog id="records-dialog" aria-labelledby="records-title">
    <form method="dialog" class="dialog-head">
      <h2 id="records-title">저장한 기록</h2>
      <button class="btn ghost" value="close">닫기</button>
    </form>
    <div id="records-list"></div>
  </dialog>

  <script src="vendor/pdfjs/pdf.min.js"></script>
  <script src="js/extract.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
